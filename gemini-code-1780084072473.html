<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSMedia Digital Thorana 2022 | Powered by KDX Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle, #111111 0%, #000000 100%);
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
            letter-spacing: 1px;
        }

        /* ඩිජිටල් තොරණ ප්‍රදර්ශනය වන කොටස */
        .thorana-display {
            position: relative;
            margin: 20px auto;
            border: 4px solid #ffcc00;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            background-color: #000;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* FOSMedia මුල් පිටුවේ ඇති තොරණේ Frame එක embed කිරීම */
        .thorana-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ඕඩියෝ ප්ලේයර් එක */
        .audio-container {
            margin: 25px 0;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        audio {
            outline: none;
        }

        /* Powered by KDX Team පාඨය */
        .footer-credits {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #aaa;
        }

        .kdx-team {
            font-weight: bold;
            color: #00e6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            text-shadow: 0 0 8px rgba(0, 230, 255, 0.6);
            animation: pulse 2s infinite alternate;
        }

        .copyright {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
        }

        /* ලස්සනට දිලිසෙන්න දාපු කුඩා Animation එකක් */
        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 8px rgba(0, 230, 255, 0.6);
            }
            100% {
                transform: scale(1.05);
                text-shadow: 0 0 18px rgba(0, 230, 255, 0.9), 0 0 28px rgba(0, 230, 255, 0.4);
            }
        }

        /* Mobile Phone වලට ගැලපෙන ලෙස සකස් කිරීම */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            .footer-credits {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FOSMedia Digital Thorana 2022</h1>

        <!-- තොරණ දර්ශනය වන කලාපය -->
        <div class="thorana-display">
            <!-- FOSMedia මුල් සේවාදායකයෙන් සජීවීව තොරණ ලබාගැනීම -->
            <iframe class="thorana-frame" src="https://fosmedia.cmb.ac.lk/vesak/2022/" title="FOSMedia Vesak Thorana"></iframe>
        </div>

        <!-- පසුබිම් වන්දනා සහ භක්ති ගීත වාදකය -->
        <div class="audio-container">
            <audio controls autoplay loop>
                <!-- FOSMedia වෙබ් අඩවියේ ඇති මුල් Audio ශ්‍රව්‍ය පථය -->
                <source src="https://fosmedia.cmb.ac.lk/vesak/2022/audio/background.mp3" type="audio/mpeg">
                ඔබේ බ්‍රවුසරය මඟින් මෙම Audio ප්ලේයරය ක්‍රියාත්මක කිරීමට සහය නොදක්වයි.
            </audio>
        </div>

        <!-- ඔබේ KDX Team සන්නාමය -->
        <div class="footer-credits">
            Powered by <span class="kdx-team">KDX Team</span>
        </div>

        <div class="copyright">
            &copy; 2022 Copyrights FOSMedia. All Rights Reserved. <br>
            Customized by KDX Team - 2026
        </div>
    </div>

</body>
</html>
