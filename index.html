<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDXbooks.lk | Sri Lanka's Online Bookshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Header Navigation */
        header {
            background-color: #0f172a;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
        }

        .logo span {
            color: #f59e0b;
        }

        .search-bar {
            display: flex;
            width: 45%;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            border-radius: 6px 0 0 6px;
            outline: none;
        }

        .search-bar button {
            padding: 0.6rem 1.2rem;
            border: none;
            background-color: #f59e0b;
            color: #0f172a;
            cursor: pointer;
            border-radius: 0 6px 6px 0;
            font-weight: 700;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-weight: 600;
            background: #1e293b;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid #334155;
            user-select: none;
        }

        .cart-badge {
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 50%;
            position: absolute;
            top: -5px;
            right: -5px;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            text-align: center;
            padding: 3.5rem 1rem;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Category Filter Chips */
        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .cat-chip {
            background: white;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            user-select: none;
            transition: all 0.2s;
        }

        .cat-chip.active, .cat-chip:hover {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: #0f172a;
            border-left: 4px solid #f59e0b;
            padding-left: 10px;
        }

        /* Book Grid Layout */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .book-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .book-cover {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 1rem;
            background-color: #e2e8f0;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .book-author {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .book-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #059669;
        }

        .add-cart-btn {
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .add-cart-btn:hover {
            background-color: #f59e0b;
            color: #0f172a;
        }

        /* Cart Sidebar Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            background: #0f172a;
            color: white;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-body {
            padding: 1rem;
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .cart-footer {
            padding: 1.2rem;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .checkout-btn {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        footer {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">KDX<span>books.lk</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" onkeyup="searchBooks()" placeholder="පොතේ නම, කර්තෘ සොයන්න...">
            <button>Search</button>
        </div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 Cart <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>Welcome to KDXbooks.lk</h1>
        <p>ඔබට අවශ්‍ය සියලුම පොත් නිවසටම ගෙන්නා ගන්න</p>
    </section>

    <main class="container">
        <!-- Category Filter Chips -->
        <div class="category-bar">
            <div class="cat-chip active" onclick="filterCategory('All', this)">සියල්ල (All)</div>
            <div class="cat-chip" onclick="filterCategory('නවකතා', this)">නවකතා</div>
            <div class="cat-chip" onclick="filterCategory('පද්‍ය/පද සංකලන', this)">පද්‍ය/පද සංකලන</div>
            <div class="cat-chip" onclick="filterCategory('හාස්‍ය', this)">හාස්‍ය</div>
        </div>

        <h2 class="section-title" id="sectionTitle">සියලුම පොත් (All Books)</h2>
        
        <!-- Dynamic Book Grid -->
        <div class="book-grid" id="bookGrid">
            <!-- Books inserted dynamically -->
        </div>
    </main>

    <!-- Cart Sidebar Drawer -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>ඔබගේ Cart එක</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cartItems">
            <p style="text-align: center; color: #64748b; margin-top: 2rem;">Cart එක හිස්ව පවතී.</p>
        </div>
        <div class="cart-footer">
            <h4>එකතුව (Total): Rs. <span id="cartTotal">0</span></h4>
            <button class="checkout-btn" onclick="alert('Checkout Process එකට යොමු කෙරේ!')">Buy Now / Checkout</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <strong>KDXbooks.lk</strong>. All rights reserved.</p>
    </footer>

    <script>
        // Updated Books Dataset based on provided images
        const books = [
            { 
                id: 1, 
                title: 'ලැවෙන්ඩර්', 
                author: 'හසිඳු නිලෝත් තිසේරා', 
                price: 1200, 
                category: 'නවකතා', 
                img: 'https://via.placeholder.com/200x300?text=Lavender' 
            },
            { 
                id: 2, 
                title: 'කවර්', 
                author: 'මහින්ද රත්නායක', 
                price: 950, 
                category: 'හාස්‍ය', 
                img: 'https://via.placeholder.com/200x300?text=Cover' 
            },
            { 
                id: 3, 
                title: 'ඒත් මං ආදරෙයි', 
                author: 'අබ්දුල් උමර් / සගන් නෙත්මිණ', 
                price: 850, 
                category: 'පද්‍ය/පද සංකලන', 
                img: 'https://via.placeholder.com/200x300?text=Eeth+Man+Adarei' 
            },
            { 
                id: 4, 
                title: 'හීනය', 
                author: 'Kavinda D Senanayaka', 
                price: 1100, 
                category: 'නවකතා', 
                img: 'https://via.placeholder.com/200x300?text=Heenaya' 
            }
        ];

        let cart = [];

        // Render books in UI
        function renderBooks(booksToDisplay) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            if (booksToDisplay.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">මේ Category එකට අදාළ පොත් හමුවූයේ නැත.</p>';
                return;
            }

            booksToDisplay.forEach(book => {
                grid.innerHTML += `
                    <div class="book-card">
                        <img src="${book.img}" alt="${book.title}" class="book-cover">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                        <div class="book-price-row">
                            <span class="price">Rs. ${book.price}</span>
                            <button class="add-cart-btn" onclick="addToCart('${book.title}', ${book.price})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        // Category Filter Logic
        function filterCategory(category, element) {
            const chips = document.querySelectorAll('.cat-chip');
            chips.forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('sectionTitle').innerText = category === 'All' ? 'සියලුම පොත් (All Books)' : category;

            if (category === 'All') {
                renderBooks(books);
            } else {
                const filtered = books.filter(b => b.category === category);
                renderBooks(filtered);
            }
        }

        // Real-time Search
        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const searched = books.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.author.toLowerCase().includes(query)
            );
            renderBooks(searched);
        }

        // Shopping Cart Controls
        function addToCart(title, price) {
            cart.push({ title, price });
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartItemsContainer = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align: center; color: #64748b; margin-top: 2rem;">Cart එක හිස්ව පවතී.</p>';
                document.getElementById('cartTotal').innerText = 0;
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.title}</strong><br>
                            <small style="color: #059669;">Rs. ${item.price}</small>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">X</button>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = html;
            document.getElementById('cartTotal').innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Initial Load
        renderBooks(books);
    </script>
</body>
</html>
